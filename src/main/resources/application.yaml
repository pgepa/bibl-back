server:
  port: 8080

spring:
  application:
    name: bibl-back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bibl}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  api:
    security:
      token:
        secret: ${JWT_SECRET:12345678}}


